name: XAUUSD SMC Alert Monitor

on:
  schedule:
    # Runs every 5 minutes (subject to GitHub Actions scheduling queue/delays)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in Dry-Run mode (no actual Telegram broadcast)'
        required: false
        default: 'false'
        type: boolean
      force_session:
        description: 'Ignore session window filter'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: xauusd-smc-monitor
  cancel-in-progress: false

jobs:
  smc-alert:
    name: Check SMC Structure & Alert
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Alert State Cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: smc-state-${{ github.run_id }}
          restore-keys: |
            smc-state-

      - name: Run SMC Detection & Alert Cycle
        env:
          INSTRUMENT: 'XAUUSD'
          TIMEFRAME: '5m'
          DATA_PROVIDER: 'yahoo'
          YAHOO_SYMBOL: 'XAUUSD=X'
          YAHOO_FALLBACK_SYMBOL: 'GC=F'
          SWING_LENGTH: '3'
          MIN_DISPLACEMENT_ATR_MULT: '1.0'
          ATR_PERIOD: '14'
          CONFIRMATION_MODE: 'close'
          FILTER_SESSIONS: 'false'
          ALERT_TIMEZONE: 'Asia/Kolkata'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          FLAGS=""
          if [ "${{ inputs.force_session }}" = "true" ]; then
            FLAGS="$FLAGS --force-session"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          python main.py $FLAGS

      - name: Persist Updated State Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: smc-state-${{ github.run_id }}
